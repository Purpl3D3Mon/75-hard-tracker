<style>

<header><h1>75 <b>Hard</b></h1><span class="tag" id="clock"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="card" id="mbody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>
<script>
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<300&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let profMode='view',chalMode='view';
const K='75hard-v1',SCHEMA=3,DEF=[["Workout 1 (45 min)","06:00"],["Workout 2 – OUTDOORS (45 min)","17:00"],["Follow diet – no cheat meals or alcohol","20:00"],["Drink 1 gallon of water","19:00"],["Read 10 pages of nonfiction","21:00"],["Take a progress photo","07:00"]];
let view='today';
/* ---------- state + migration (lossless) ---------- */
function migrate(s){if(!s||typeof s!=='object')return null;const v=s.v||1;
 if(v<2){try{localStorage.setItem(K+'-backup-v1',JSON.stringify(s))}catch(e){}
  s.days=s.days||{};s.fired=s.fired||{};s.tasks=s.tasks||[];s.profile=s.profile||{};s.weights=s.weights||[];s.attempts=s.attempts||[];s.aid=s.aid||'a1';s.v=2}
 if((s.v||1)<3){s.profile=s.profile||{};if(s.profile.age&&!s.profile.legacyAge)s.profile.legacyAge=s.profile.age;s.v=3}
 return s}
let S=migrate(JSON.parse(localStorage.getItem(K)||'null'));if(S)localStorage.setItem(K,JSON.stringify(S));
const save=()=>localStorage.setItem(K,JSON.stringify(S));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
/* ---------- utils ---------- */
const ymd=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const today=()=>ymd(new Date());const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=s=>new Date(s+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const fmtT=t=>{const[h,m]=t.split(':');const d=new Date();d.setHours(h,m);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
const hm=ts=>new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const $=id=>document.getElementById(id);const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)};
const closeM=()=>$('modal').classList.remove('on');const openM=h=>{$('mbody').innerHTML=h;$('modal').classList.add('on')};
const editing=()=>!S||view==='set'||view==='settings'||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
const isPhotoTask=t=>/photo/i.test(t.name);
/* ---------- task order: earliest reminder first, stable ties; unknown times last ---------- */
const normT=t=>{const m=String(t==null?'':t).match(/^(\d{1,2}):(\d{2})/);return m?m[1].padStart(2,'0')+':'+m[2]:''};
const cmpTask=(ta,tb,ia,ib)=>{const ea=!ta,eb=!tb;if(ea!==eb)return ea?1:-1;return ta<tb?-1:ta>tb?1:ia-ib};
const byTime=list=>list.map((t,i)=>({t,i})).sort((a,b)=>cmpTask(normT(a.t.time),normT(b.t.time),a.i,b.i)).map(x=>x.t);
const byDayTime=list=>{const meta=new Map((S&&S.tasks||[]).map(t=>[t.id,normT(t.time)]));return list.map((t,i)=>({t,i})).sort((a,b)=>{const A=meta.has(a.t.id),B=meta.has(b.t.id);if(A!==B)return A?-1:1;return cmpTask(A?meta.get(a.t.id):'',B?meta.get(b.t.id):'',a.i,b.i)}).map(x=>x.t)};
/* ---------- IndexedDB photos ---------- */
let dbp;function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('75hard-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('photos',mode),st=tx.objectStore('photos');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})}
const pKey=s=>S.aid+':'+s;const putPhoto=(k,b)=>idb('readwrite',st=>st.put(b,k));const getPhoto=k=>idb('readonly',st=>st.get(k));const allKeys=()=>idb('readonly',st=>st.getAllKeys());
let urlCache={};async function photoURL(s){const k=pKey(s);if(urlCache[k])return urlCache[k];const b=await getPhoto(k);return b?(urlCache[k]=URL.createObjectURL(b)):null}
let photoSet=new Set();async function loadPhotoSet(){try{const ks=await allKeys();photoSet=new Set(ks.filter(k=>k.startsWith(S.aid+':')).map(k=>k.slice(S.aid.length+1)))}catch(e){}}
async function compress(file){const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
 const sc=Math.min(1,1080/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.82))}
const canPhoto=s=>!!S&&!!s&&s>=S.start&&s<=today()&&s<=addD(S.start,74);
const lockMsg=()=>dayNum()<1?'Photos unlock on Day 1 — '+fmtD(S.start):'Photos are only for today and past challenge days';
let photoDay=null;function takePhoto(s){s=s||today();if(!canPhoto(s))return toast(lockMsg());photoDay=s;$('photoIn').value='';$('photoIn').click()}
$('photoIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;photoDay=photoDay||today();if(!canPhoto(photoDay)){photoDay=null;return toast(lockMsg())}try{const b=await compress(f);const k=pKey(photoDay);await putPhoto(k,b);if(urlCache[k])URL.revokeObjectURL(urlCache[k]);delete urlCache[k];photoSet.add(photoDay);
 const d=day(photoDay);if(!d.status||photoDay===today()){d.tasks.forEach(t=>{if(isPhotoTask(t)&&!t.done)t.done=Date.now()})}save();photoDay=null;toast('Photo saved');closeM();render()}catch(err){alert('Could not save photo: '+err.message)}};
/* ---------- challenge logic ---------- */
function day(s){if(!S.days[s])S.days[s]={tasks:S.tasks.map(t=>({id:t.id,name:t.name,done:null})),status:null};return S.days[s]}
const dayNum=()=>diff(S.start,today())+1;
function finalize(){if(!S)return;const t=today();let n=0;for(let i=0;i<75;i++){const s=addD(S.start,i);if(s>=t)break;const d=day(s);if(!d.status){d.status=d.tasks.every(x=>x.done)?'complete':'incomplete';n++}}if(n)save()}
function stats(){let c=0,x=0,cur=0,best=0,run=0;const t=today();for(let i=0;i<75;i++){const s=addD(S.start,i);if(s>t)break;const d=S.days[s];
 const ok=d&&(d.status==='complete'||(s===t&&d.tasks.length&&d.tasks.every(z=>z.done)));if(d&&d.status==='complete')c++;if(d&&d.status==='incomplete')x++;
 if(ok){run++;best=Math.max(best,run)}else if(s!==t)run=0}cur=run;return{c,x,cur,best}}
/* ---------- icons ---------- */
const IC={today:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',gal:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',stats:'<path d="M18 20V10M12 20V4M6 20v-6"/>',set:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
const NAV=[['today','Today'],['cal','Calendar'],['gal','Gallery'],['stats','Stats'],['set','Profile']];
const FLAME='<svg viewBox="0 0 24 30"><defs><linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3b30"/><stop offset=".6" stop-color="#ff8a00"/><stop offset="1" stop-color="#ffd60a"/></linearGradient></defs><path fill="url(#fg)" d="M12 1c1 5 7 8 7 16a7 7 0 0 1-14 0c0-4 2-6 3-8 0 3 1 4 2 5 0-5 1-9 2-13z"/><path fill="#ffe8a3" d="M12 15c1 2 3 3 3 6a3 3 0 0 1-6 0c0-2 1-3 2-4 0 1 .5 1.5 1 2 0-1.5 0-3 0-4z"/></svg>';
/* ---------- render ---------- */
function render(){const nav=$('nav');nav.style.display=S?'flex':'none';nav.innerHTML=NAV.map(([v,l])=>`<button data-v="${v}" class="${v===view?'on':''}"><svg viewBox="0 0 24 24">${IC[v]}</svg>${l}</button>`).join('');
 const A=$('app');if(!S)return A.innerHTML=setupHTML(true);finalize();
 A.innerHTML=view==='today'?todayHTML():view==='cal'?calHTML():view==='gal'?galHTML():view==='stats'?statsHTML():setupHTML(false);
