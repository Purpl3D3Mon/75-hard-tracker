 let h=`<div class="row" style="justify-content:space-between"><div><div class="big">Day ${i}</div><div class="mut">${fmtD(s)}</div></div><span class="pill ${st==='complete'?'c':st==='incomplete'?'x':''}">${esc(st)}</span></div>`;
 byDayTime(d.tasks).forEach(t=>{const label=t.done?'Checked':(open?'Still open':'Missed');h+=`<div class="task ${t.done?'done':''}" data-id="${esc(t.id)}" style="cursor:default"><div class="box" style="${!t.done&&!open?'border-color:var(--red)':''}">${t.done?'<svg viewBox="0 0 24 24" style="stroke-dashoffset:0"><path d="M5 12l5 5 9-10"/></svg>':(open?'':'<span style="color:var(--red);font-weight:700">✕</span>')}</div><div><div class="tn">${esc(t.name)}</div><div class="mut">${label}</div></div></div>`});
 if(u)h+=`<img src="${u}" style="width:100%;border-radius:12px;margin-top:10px">`;
 h+=liftBreakdown(s);
 openM(h+`<div class="row" style="margin-top:12px">${canPhoto(s)?`<button class="sec" style="flex:1" onclick="takePhoto('${s}')">📷 ${u?'Replace':'Add'} photo</button>`:''}<button class="ghost" style="flex:1" onclick="closeM()">Close</button></div>`)}
const MS=[1,7,30,50,75];
function galHTML(){const t=today(),n=Math.min(Math.max(dayNum(),0),75);if(dayNum()<1)return`<div class="card lock"><div class="lockic">🔒</div><h2>Gallery Locked</h2><div class="big" style="font-size:22px">Photos unlock on Day 1</div><div class="tag" style="margin-top:6px;color:var(--org)">${fmtD(S.start)}</div><p class="mut">No early photos. Your Day 1 shot is the baseline everything gets compared against.</p></div>`;const live=canPhoto(t);let h=`<div class="card"><h2>Milestones</h2><div class="ms">${MS.map(m=>{const s=addD(S.start,m-1),d=S.days[s];const ok=photoSet.has(s)||(d&&d.status==='complete');return`<div class="${ok?'ok':''}">${ok?'✓ ':''}D${m}</div>`}).join('')}</div></div>`;
 h+=`<div class="card"><div class="row" style="justify-content:space-between;margin:0 0 10px"><h2 style="margin:0">Progress Photos</h2>${live?'<button style="min-height:40px;padding:8px 14px" onclick="takePhoto()">📷 Today</button>':'<span class="pill">🔒 Closed</span>'}</div><div class="strip" id="strip">`;
 for(let i=0;i<n;i++){const s=addD(S.start,i);h+=photoSet.has(s)?`<div class="ph" data-s="${s}" onclick="show('${s}')"><img alt=""><div class="lb">DAY ${i+1}${MS.includes(i+1)?' ★':''}</div></div>`:`<div class="ph empty" onclick="takePhoto('${s}')" style="aspect-ratio:3/4"><div style="text-align:center"><div class="big" style="color:#444">DAY ${i+1}</div><div>Tap to add</div></div></div>`}
 h+=`</div><p class="mut">${photoSet.size} photo(s). Swipe to scroll through days.</p></div>`;
 const ds=[...photoSet].filter(s=>s>=S.start).sort();if(ds.length>=2)h+=`<div class="card"><h2>Compare</h2><div class="cmp"><div class="ph" id="cA"><img alt=""><div class="lb">DAY ${diff(S.start,ds[0])+1}</div></div><div class="ph" id="cB"><img alt=""><div class="lb">DAY ${diff(S.start,ds[ds.length-1])+1}</div></div></div></div>`;
 return h}
async function hydrateGal(){for(const el of document.querySelectorAll('#strip .ph[data-s]')){const u=await photoURL(el.dataset.s);if(u)el.querySelector('img').src=u}
 const ds=[...photoSet].filter(s=>s>=S.start).sort();if(ds.length>=2&&$('cA')){$('cA').querySelector('img').src=await photoURL(ds[0]);$('cB').querySelector('img').src=await photoURL(ds[ds.length-1])}
 const st=$('strip');if(st)st.scrollLeft=st.scrollWidth}
function statsHTML(){const st=stats(),t=today();const per={};
 for(let i=0;i<75;i++){const s=addD(S.start,i);if(s>=t)break;const d=S.days[s];if(!d||(d.status!=='complete'&&d.status!=='incomplete'))continue;(d.tasks||[]).forEach(x=>{const p=per[x.id]||(per[x.id]={id:x.id,name:x.name,done:0,tot:0});p.tot++;if(x.done)p.done++})}
 const arr=byDayTime(Object.values(per)),mm=arr.filter(a=>a.tot-a.done>0).sort((a,b)=>(b.tot-b.done)-(a.tot-a.done))[0],pct=Math.round(st.c/75*100),ts=todayScore();
 let h=`<div class="card"><h2>Performance</h2><div class="stats"><div class="st"><div class="tag">Challenge</div><div class="big">${pct}%</div><div class="mut">${st.c}/75 complete</div></div><div class="st"><div class="tag">Missed</div><div class="big" style="color:${st.x?'var(--red)':'inherit'}">${st.x}</div><div class="mut">days</div></div><div class="st"><div class="tag">Streak</div><div class="big">🔥 ${st.cur}</div><div class="mut">best ${st.best}</div></div><div class="st"><div class="tag">Photos</div><div class="big">${photoSet.size}</div><div class="mut">saved</div></div></div>${ts?`<p class="mut" id="todayScore" style="text-align:center;margin:12px 0 0">Today: ${ts.done}/${ts.tot} done</p>`:''}</div>`;
 h+=`<div class="card"><h2>Task Completion</h2>${arr.length?arr.map(a=>{const r=Math.round(a.done/a.tot*100);return`<div class="rate"><div class="row" style="justify-content:space-between;margin:0"><span>${esc(a.name)}</span><b>${r}%</b></div><div class="bar"><i style="width:${r}%"></i></div></div>`}).join(''):'<p class="mut">No finished days yet. Today is still in progress, so unchecked tasks are not misses.</p>'}</div>`;
 h+=`<div class="card"><h2>Most Missed</h2>${arr.length?(mm?`<div class="big" style="font-size:20px">${esc(mm.name)}</div><div class="mut">missed ${mm.tot-mm.done} of ${mm.tot} days</div>`:'<p class="mut">Nothing missed. Keep it that way.</p>'):'<p class="mut">Nothing to rank until a full day is on the books.</p>'}</div>`;
 const w=S.weights||[];if(w.length){const f=w[0].kg,l=w[w.length-1].kg;h+=`<div class="card"><h2>Weight</h2><div class="mut">${w.length} entries · latest ${l} · change ${(l-f>0?'+':'')+(Math.round((l-f)*10)/10)}</div></div>`}
 return h+`<p class="mut" style="text-align:center">${S.attempts.length} archived attempt(s)</p>`}
function setupHTML(first){const ts=byTime(S?S.tasks:DEF.map((d,i)=>({id:'t'+i,name:d[0],time:d[1]}))),perm='Notification' in window?Notification.permission:'unsupported';
 let h='';if(first)h+=`<div class="card"><div class="big">Set up your 75 Hard</div><p class="mut">Pick your start date and reminder times.</p></div>`;
 if(!first)h+=profileHTML();
 h+=challengeHTML(ts,first);
 h+=`<div class="card"><h2>Reminders</h2><span class="pill">${perm}</span><p class="mut">Fires at each task's time if it isn't checked. <b>Limitation:</b> no push server, so reminders only fire reliably while the app is open or recently backgrounded. iPhone: Add to Home Screen from Safari first, open from there, then enable. Set phone alarms as backup.</p><div class="row"><button style="flex:1" onclick="askPerm()">Enable</button><button class="sec" style="flex:1" onclick="notify('Test reminder','Notifications are working 💪','test')">Test</button></div></div>`;
 if(first)return h;
 h+=`<div class="card"><h2>Backup</h2><p class="mut">Data lives only on this device. Export regularly (includes photos).</p><div class="row"><button class="sec" style="flex:1" onclick="exportData()">⬇ Export</button><button class="sec" style="flex:1" onclick="$('importIn').click()">⬆ Import</button></div></div>
 <div class="card"><h2>The Rules</h2><ol class="rules mut"><li>Follow a diet. No cheat meals, no alcohol.</li><li>Two 45-minute workouts. One must be outdoors.</li><li>Drink one gallon of water.</li><li>Read 10 pages of nonfiction.</li><li>Take a progress photo.</li></ol><p class="mut">Miss anything, any day → back to Day 1. No modifications, no substitutions.</p></div>
 <div class="card warn"><h2>Restart</h2><p class="mut">Starts Day 1 today. Your current attempt is archived in history, never deleted.</p><button onclick="restart()">Restart challenge</button></div><p class="mut" style="text-align:center">75 Hard Tracker · schema v${SCHEMA}</p>`;return h}
function showTime(t){const n=normT(t);return n?fmtT(n):'—'}
function challengeHTML(ts,first){if(!first&&chalMode!=='edit')return `<div class="card hero2"><div class="tag" style="color:var(--org)">Challenge</div><div class="pname" style="font-size:28px">${fmtD(S.start)}</div><div class="mut">Start date · ${esc(S.start)} · ${ts.length} daily order${ts.length===1?'':'s'}</div><div class="crows">${ts.map(t=>`<div class="crow" data-id="${esc(t.id)}" data-time="${esc(normT(t.time))}"><span class="tn">${esc(t.name)}</span><span class="tm">${esc(showTime(t.time))}</span></div>`).join('')}</div><button class="sec w" style="margin-top:14px" onclick="chalMode='edit';render()">✎ Edit challenge</button></div>`;
 let h=`<div class="card${first?'':' pedit'}">${first?'<h2>Challenge</h2>':`<div class="row" style="justify-content:space-between;margin:0 0 6px"><h2 style="margin:0">Edit Challenge</h2><span class="tag">Orders</span></div>`}<label class="f"><span>Start date</span><input type="date" id="sd" value="${S?S.start:today()}"></label><div class="tag" style="margin-top:12px">Tasks & reminder times</div><div id="tl">`;
 ts.forEach(t=>h+=`<div class="row" data-id="${esc(t.id)}"><input type="text" style="flex:1" value="${esc(t.name)}"><input type="time" style="flex:0 0 112px" value="${esc(t.time)}"><button class="sec" style="flex:0 0 48px;padding:0" onclick="this.parentNode.remove()" aria-label="remove">✕</button></div>`);
 if(first)return h+`</div><div class="row"><button class="sec" style="flex:1" onclick="addRow()">+ Add task</button><button style="flex:1" onclick="saveSet()">Start</button></div></div>`;
 return h+`</div><div class="row"><button class="sec" style="flex:1" onclick="addRow()">+ Add task</button></div><div class="row"><button class="ghost" style="flex:1" onclick="chalMode='view';render()">Cancel</button><button style="flex:2" onclick="saveSet()">Save</button></div></div>`}
function ageStr(dob){if(!dob)return'';const b=new Date(dob+'T12:00'),n=new Date(today()+'T12:00');let y=n.getFullYear()-b.getFullYear();let last=new Date(b);last.setFullYear(b.getFullYear()+y);if(last>n){y--;last=new Date(b);last.setFullYear(b.getFullYear()+y)}const d=Math.round((n-last)/864e5);return y+' years, '+d+' day'+(d===1?'':'s')}
function initials(n){return(n||'75').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'75'}
function profileHTML(){const p=S.profile||{},w=S.weights||[],cur=w.length?w[w.length-1].kg:null,st=stats(),dn=Math.min(Math.max(dayNum(),0),75);
 if(profMode==='edit')return`<div class="card pedit"><div class="row" style="justify-content:space-between;margin:0 0 6px"><h2 style="margin:0">Edit Profile</h2><span class="tag">Dossier</span></div>
 <label class="f"><span>Name</span><input id="pName" value="${esc(p.name)}" placeholder="Your name"></label>
 <label class="f"><span>Date of birth</span><input type="date" id="pDob" max="${today()}" value="${esc(p.dob)}"></label>${!p.dob&&p.legacyAge?`<div class="mut" style="margin-top:-4px">Previously saved age: ${esc(p.legacyAge)} — add your DOB for an exact age.</div>`:''}
 <div class="g2"><label class="f"><span>Height</span><input id="pHeight" placeholder="5'11&quot;" value="${esc(p.height)}"></label><label class="f"><span>Start weight</span><input id="pStartW" inputmode="decimal" value="${esc(p.startW)}"></label><label class="f"><span>Goal weight</span><input id="pGoalW" inputmode="decimal" value="${esc(p.goalW)}"></label></div>
 <label class="f"><span>Why I'm doing this</span><textarea id="pWhy" placeholder="The reason you won't quit">${esc(p.why)}</textarea></label>
 <div class="row"><button class="ghost" style="flex:1" onclick="profMode='view';render()">Cancel</button><button style="flex:2" onclick="saveProfile()">Save</button></div></div>`;
 const sw=parseFloat(p.startW),gw=parseFloat(p.goalW),cw=cur!=null?cur:sw;let prog='';if(sw&&gw&&sw!==gw){const pc=Math.max(0,Math.min(100,Math.round((sw-cw)/(sw-gw)*100)));prog=`<div class="wbar"><i style="width:${pc}%"></i></div><div class="mut" style="text-align:right">${pc}% to goal</div>`}
 return`<div class="card hero2"><div class="stamp">ATTEMPT #${S.attempts.length+1}</div><div class="row" style="gap:16px;margin:0"><div class="avatar" id="avatar">${esc(initials(p.name))}</div><div style="min-width:0"><div class="tag" style="color:var(--org)">Operator</div><div class="pname">${esc(p.name||'Your Name')}</div><div class="mut" id="ageTxt">${p.dob?ageStr(p.dob):p.legacyAge?esc(p.legacyAge)+' years':'Age not set'}${p.height?' · '+esc(p.height):''}</div></div></div>
 ${!p.dob?`<div class="dobask" onclick="profMode='edit';render()">🎂 Add your date of birth to track your exact age →</div>`:''}
 <div class="pstats"><div><div class="big">${dn}</div><div class="tag">Day</div></div><div><div class="big">🔥${st.cur}</div><div class="tag">Streak</div></div><div><div class="big">${st.best}</div><div class="tag">Best</div></div></div>
 <div class="wts"><div><div class="tag">Start</div><b>${esc(p.startW||'—')}</b></div><div><div class="tag">Current</div><b style="color:var(--org)">${cw||'—'}</b></div><div><div class="tag">Goal</div><b>${esc(p.goalW||'—')}</b></div></div>${prog}
 ${p.why?`<blockquote>“${esc(p.why)}”</blockquote>`:''}<button class="sec w" style="margin-top:12px" onclick="profMode='edit';render()">✎ Edit profile</button></div>
 <div class="card"><h2>Weight Log</h2><div class="row"><input id="wIn" inputmode="decimal" placeholder="Today's weight"><button style="flex:0 0 auto" onclick="logW()">Log</button></div>${w.slice(-5).reverse().map(x=>`<div class="row mut" style="justify-content:space-between"><span>${fmtD(x.date)}</span><b style="color:var(--tx)">${x.kg}</b></div>`).join('')}</div><div class="tag" style="margin:22px 4px 0">⚙ Settings</div>`}
async function hydrateAvatar(){const ds=[...photoSet].filter(x=>x>=S.start).sort();const el=$('avatar');if(!el||!ds.length)return;const u=await photoURL(ds[ds.length-1]).catch(()=>null);if(u)el.innerHTML=`<img src="${u}" alt="">`}
function addRow(){const r=document.createElement('div');r.className='row';r.dataset.id='t'+Date.now();r.innerHTML='<input type="text" style="flex:1" placeholder="New task"><input type="time" style="flex:0 0 112px" value="12:00"><button class="sec" style="flex:0 0 48px;padding:0" onclick="this.parentNode.remove()">✕</button>';$('tl').appendChild(r)}
function saveProfile(){const g=id=>$(id).value.trim();if(g('pDob')&&g('pDob')>today())return alert('Date of birth can’t be in the future');S.profile={...S.profile,name:g('pName'),dob:g('pDob'),height:g('pHeight'),startW:g('pStartW'),goalW:g('pGoalW'),why:g('pWhy')};save();profMode='view';toast('Profile saved');render()}
function logW(){const v=parseFloat($('wIn').value);if(!v)return;S.weights=S.weights||[];const t=today(),e=S.weights.find(w=>w.date===t);if(e)e.kg=v;else S.weights.push({date:t,kg:v});save();toast('Weight logged');render()}
function saveSet(){const tasks=byTime([...document.querySelectorAll('#tl .row')].map(r=>{const i=r.querySelectorAll('input');return{id:r.dataset.id,name:i[0].value.trim(),time:i[1].value||'12:00'}}).filter(t=>t.name));if(!tasks.length)return alert('Add at least one task');
 const sd=$('sd').value||today();if(!S){S=migrate({start:sd,tasks,days:{},fired:{}});save();view='today';chalMode='view';loadPhotoSet().then(render);return}
 if(sd!==S.start){if(!confirm('Changing the start date archives the current attempt and starts a fresh one. Continue?'))return;archive();S.start=sd}
 S.tasks=tasks;const d=S.days[today()];if(d&&!d.status)d.tasks=tasks.map(t=>({id:t.id,name:t.name,done:(d.tasks.find(x=>x.id===t.id)||{}).done||null}));save();chalMode='view';toast('Saved');render()}
function archive(){S.attempts.push({aid:S.aid,start:S.start,tasks:S.tasks,days:S.days,lifts:JSON.parse(JSON.stringify(S.lifts||{})),endedAt:Date.now()});S.aid='a'+Date.now();S.days={};S.fired={};photoSet=new Set()}
async function deleteAttempt(i){const list=S&&S.attempts,a=list&&list[i];if(!a)return;if(!confirm('Delete this attempt permanently?'))return;const aid=a.aid;list.splice(i,1);save();
 try{if(aid&&aid!==S.aid&&!list.some(x=>x&&x.aid===aid)){const ks=await allKeys(),prefix=String(aid)+':',cur=String(S.aid)+':';const mine=ks.filter(k=>typeof k==='string'&&k.startsWith(prefix)&&!k.startsWith(cur));
  if(mine.length){const d=await db();await new Promise((res,rej)=>{const tx=d.transaction('photos','readwrite'),st=tx.objectStore('photos');mine.forEach(k=>{st.delete(k);if(urlCache[k]){URL.revokeObjectURL(urlCache[k]);delete urlCache[k]}});tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}}}catch(e){}
 toast('Attempt deleted');render()}
function restart(){if(!confirm('Restart 75 Hard from Day 1 today? Your current attempt will be archived (kept in history).'))return;archive();S.start=today();save();view='today';render()}
async function exportData(){try{const d=await db(),out={app:'75hard',schema:SCHEMA,exported:new Date().toISOString(),state:S,photos:{}};const ks=await allKeys();
 for(const k of ks){const b=await getPhoto(k);out.photos[k]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='75hard-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup exported')}catch(e){alert('Export failed: '+e.message)}}
$('importIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;photoDay=photoDay||today();try{const j=JSON.parse(await f.text());const st=migrate(j.state||j);if(!st||!st.start)throw new Error('Not a 75 Hard backup');
 if(!confirm('Import this backup? Current data will be replaced (a copy of it is kept on this device as a safety backup).'))return;localStorage.setItem(K+'-preimport-'+Date.now(),JSON.stringify(S));
 for(const[k,u]of Object.entries(j.photos||{})){const b=await (await fetch(u)).blob();await putPhoto(k,b)}S=st;save();urlCache={};await loadPhotoSet();toast('Backup imported');view='today';render()}catch(err){alert('Import failed: '+err.message)}};
async function askPerm(){if(!('Notification' in window))return alert('Notifications not supported here. On iPhone, add to Home Screen first.');await Notification.requestPermission();render()}
async function notify(title,body,tag){if(!('Notification' in window)||Notification.permission!=='granted')return alert('Enable notifications first.');try{const r=await navigator.serviceWorker.ready;r.showNotification(title,{body,tag,icon:'icon.svg'})}catch(e){new Notification(title,{body})}}
const diffMin=(a,b)=>{const f=s=>s.split(':')[0]*60+ +s.split(':')[1];return f(b)-f(a)};
function tick(){$('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(!S)return;const at=$('ageTxt');if(at&&S.profile.dob){const t=ageStr(S.profile.dob)+(S.profile.height?' · '+S.profile.height:'');if(at.textContent!==t)at.textContent=t}
 if(S.lastDay!==today()){S.lastDay=today();save();if(!editing())render()}const n=dayNum();if(n<1||n>75||!('Notification' in window)||Notification.permission!=='granted')return;
 const now=new Date(),h=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),d=day(today());S.fired=S.fired||{};
 S.tasks.forEach(t=>{const k=today()+t.id;if(t.time<=h&&!S.fired[k]){S.fired[k]=1;save();const dt=d.tasks.find(x=>x.id===t.id);if(dt&&!dt.done&&diffMin(t.time,h)<60)notify('75 Hard – Day '+n,t.name,k)}})}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.v){closeCam();stopTimer();closeM();view=b.dataset.v;profMode='view';chalMode='view';woMode='view';window.scrollTo(0,0);render()}};
function onVis(){if(document.hidden){cancelCamCount();stopCamTracks();return}if($('cam')&&$('cam').classList.contains('on')&&!$('cam').classList.contains('reviewing'))startCam().catch(()=>{});if(!editing())render();tick()}
document.addEventListener('visibilitychange',onVis);
window.addEventListener('pagehide',()=>{cancelCamCount();stopCamTracks();stopTimer()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();if(S)loadPhotoSet().then(()=>{if(!editing())render()});tick();setInterval(tick,20000);
</script></body></html>
